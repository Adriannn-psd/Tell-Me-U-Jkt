services:
  tellmeu-app:
    build:
      context: .
      target: web
      # Diteruskan dari .env di folder ini (bukan env_file): NEXT_PUBLIC_* harus
      # sudah ada saat `npm run build`, karena nilainya ditanam ke hasil build.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    container_name: tellmeu-web
    restart: always
    expose:
      - "3000"
    env_file:
      - .env
    networks:
      - webnet

  radar-scraper:
    build:
      context: .
      # Stage `scraper` berhenti sebelum npm: daemon ini cuma perlu Python.
      target: scraper
    container_name: radar-scraper-daemon
    restart: always
    command: ["python3", "radar_daemon.py"]
    env_file:
      - .env
    networks:
      - webnet

  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - webnet
    depends_on:
      - tellmeu-app

volumes:
  caddy_data:
  caddy_config:

networks:
  webnet:
