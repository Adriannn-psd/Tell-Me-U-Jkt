services:
  tellmeu-app:
    build:
      context: .
      target: web
      # Diteruskan dari .env di folder ini (bukan env_file): NEXT_PUBLIC_* harus
      # sudah ada saat `npm run build`, karena nilainya ditanam ke hasil build.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    container_name: tellmeu-web
    restart: always
    expose:
      - "3000"
    env_file:
      - .env
    networks:
      # webnet: internal antar service repo ini. edge: tempat caddy-proxy
      # (deploy/proxy) menemukan container ini lewat nama `tellmeu-web`.
      - webnet
      - edge

  radar-scraper:
    build:
      context: .
      # Stage `scraper` berhenti sebelum npm: daemon ini cuma perlu Python.
      target: scraper
    container_name: radar-scraper-daemon
    restart: always
    command: ["python3", "radar_daemon.py"]
    env_file:
      - .env
    networks:
      - webnet

networks:
  webnet:
  # Reverse proxy tinggal di deploy/proxy sebagai compose project sendiri, jadi
  # network ini dibuat di luar: docker network create edge
  edge:
    external: true
